location / {

  proxy_pass      http://127.0.0.1:__PORT__/;
  # NOT proxy_params: /nostr-login is the unauthenticated entry point people
  # visit to *obtain* a YunoHost session (PLAN.md Phase 6) - it must not
  # require an existing SSOwat session to load.
  include         proxy_params_no_auth;
  proxy_redirect  off;

  client_max_body_size 1M;

  # Confirmed on a real install: YunoHost's own nginx baseline
  # (security.conf.inc) sets Content-Security-Policy: upgrade-insecure-requests
  # for every app domain via more_set_headers, which *replaces* rather than
  # merges with whatever CSP header our own app response sets - so the
  # strict policy web/page.py sets in Python never actually reaches the
  # browser unless this location re-asserts it here too, at a more specific
  # nginx level, which takes precedence. Keep this in sync with
  # CONTENT_SECURITY_POLICY in the upstream repo's web/page.py.
  more_set_headers "Content-Security-Policy: upgrade-insecure-requests; default-src 'self'; connect-src 'self' wss:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; img-src 'self' data:;";
}
