#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nostr_auth"
name = "Nostr Authentication"
description.en = "Sign in to your YunoHost account with a linked Nostr identity (NIP-07), alongside your existing password"
description.fr = "Connectez-vous à votre compte YunoHost avec une identité Nostr liée (NIP-07), en complément de votre mot de passe"

version = "0.1.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
admindoc = "https://github.com/imattau/yunohost-nostr-auth/blob/master/PLAN.md"
code = "https://github.com/imattau/yunohost-nostr-auth"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = false
disk = "100M"
ram.build = "256M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/yunohost-nostr-auth/archive/refs/tags/v0.1.0.tar.gz"
    sha256 = "TODO_FILL_IN_ON_FIRST_TAGGED_RELEASE"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # Holds the SQLite identity mapping DB (ynh_username <-> pubkey) so it
    # survives upgrades and reinstalls - see identity/mappings.py in the
    # upstream repo.

    [resources.permissions.main]
    url = "/nostr-login"
    # No SSOwat protection here: this is the unauthenticated entry point
    # people visit *to* authenticate (PLAN.md Phase 6). It's the standalone
    # page, not a normal SSO-protected app.
    allowed = "visitors"

    [resources.ports.main]
    default = 8766

    [resources.apt]
    packages = "python3-venv, python3-dev, build-essential, libffi-dev, pkg-config"
