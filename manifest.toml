#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nostr_auth"
name = "Nostr Authentication"
description.en = "Sign in to your YunoHost account with linked Nostr identities (NIP-07, NIP-46, or passkey), alongside your existing password"
description.fr = "Connectez-vous à votre compte YunoHost avec des identités Nostr liées (NIP-07, NIP-46 ou passkey), en complément de votre mot de passe"

version = "0.9.3~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-or-later"
admindoc = "https://github.com/imattau/yunohost-nostr-auth/blob/master/PLAN.md"
code = "https://github.com/imattau/yunohost-nostr-auth"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = false
disk = "100M"
ram.build = "256M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/yunohost-nostr-auth/archive/refs/tags/v0.9.3.tar.gz"
    sha256 = "24aab9db30ff0a3b8f13049ba02e661d1690fdb3d648e0f0857543506ba26d5d"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    # Default group is "__APP__:rx" - only $app's own group can read/traverse
    # it. nostr_auth-mint-session.service runs as ynh-portal, a *different*
    # system user, and needs to execute
    # $install_dir/venv/bin/yunohost-nostr-auth-mint-session-server -
    # confirmed on a real install: without this, systemd fails that
    # service with "203/EXEC ... Permission denied" before it ever gets a
    # chance to bind its socket. install_dir holds only our own source/venv,
    # no secrets, so granting ynh-portal group read+execute here is a
    # narrow, low-risk carve-out, not a general loosening.
    group = "ynh-portal:rx"

    [resources.data_dir]
    # Holds the SQLite identity mapping DB (ynh_username <-> pubkey) so it
    # survives upgrades and reinstalls - see identity/mappings.py in the
    # upstream repo.

    [resources.permissions.main]
    url = "/"
    # Whole app, deliberately: both /nostr-login (unauthenticated, for
    # anyone) and /nostr-account (needs an existing YunoHost session) must
    # be reachable by visitors at the SSOwat level - the actual
    # authorization for account-linking actions happens in-app (see
    # identity/linking.py, which checks the forwarded YunoHost cookie
    # itself), not via SSOwat permissions.
    allowed = "visitors"

    [resources.permissions.admin]
    # A narrower, admins-only carve-out of `main` (YunoHost resolves the
    # more specific URL first) for the cross-user identity dashboard - see
    # this app's own PLAN.md Phase 14 and server.py's admin_page /
    # /nostr-admin/api/* routes, which already re-check the "admins" group
    # themselves via yunohost-portal-api's /me. This SSOwat-level permission
    # is defense in depth on top of that in-app check, and gives admins
    # their own portal tile straight to the dashboard instead of the
    # sign-in page `main`'s tile leads to.
    url = "/nostr-admin"
    # /nostr-admin/api/* is a subpath of this url, so it's covered by the
    # same prefix match already - the same way `main`'s "/" already covers
    # every other route in this app (/nostr-login, /identities, ...).
    allowed = "admins"
    show_tile = true
    label = "Nostr Identities (Admin)"
    protected = true

    [resources.ports.main]
    default = 8766

    [resources.apt]
    # python3-ldap: nostr_auth-mint-session.service (runs as ynh-portal)
    # needs it for the anonymous LDAP lookup in ldap_lookup.py - installed
    # via apt, not pip, and reached through the venv's
    # --system-site-packages flag (see scripts/_common.sh), the same way
    # YunoHost's own moulinette dependencies are reached rather than
    # duplicated in our own venv. (No longer needs sudo: session minting
    # talks to a separate always-running service over a Unix socket
    # instead - see PHASE0_INVESTIGATION.md's "Privilege-drop redesign" in
    # the upstream repo.)
    packages = "python3-venv, python3-dev, python3-ldap, build-essential, libffi-dev, pkg-config"
